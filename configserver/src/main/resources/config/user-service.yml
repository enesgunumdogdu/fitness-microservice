server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/fitness_user_db
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://user-service:8081}
    audience: ${AUTH_JWT_AUDIENCE:fitness-platform}
    access-token-ttl: ${AUTH_JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${AUTH_JWT_REFRESH_TTL:P30D}
    keys-directory: ${AUTH_JWT_KEYS_DIR:/var/lib/auth-keys}
    key-id: ${AUTH_JWT_KEY_ID:auth-key-1}
